project:
  name: smart-nappy-ai

# ROIs are fractions of image width/height (x, y, w, h) so they are resolution independent.
# Print the patch with a white reference square and keep this layout fixed.
layout:
  reference_white: {x: 0.04, y: 0.08, w: 0.10, h: 0.18}
  chambers:
    ph:       {x: 0.25, y: 0.20, w: 0.14, h: 0.35}
    ammonia:  {x: 0.45, y: 0.20, w: 0.14, h: 0.35}
    moisture: {x: 0.65, y: 0.20, w: 0.14, h: 0.35}

colour:
  reference_white_target: [235, 235, 235]   # what the white patch SHOULD read after correction
  roi_trim_fraction: 0.10                   # drop darkest/brightest pixels (glare, edges)
  max_wb_gain: 2.0                          # warn if lighting correction exceeds this

# Which chamber predicts which measured quantity.
models:
  ph:       {chamber: ph,       target: ph}
  moisture: {chamber: moisture, target: volume_ml}

training:
  measurements_csv: data/raw/measurements.csv
  image_dir: data/raw/images
  n_estimators: 300
  n_splits: 5
  seed: 42

microfluidics:
  channel_width_mm: 2.0
  channel_depth_mm: 0.5
  retention_factor: 1.0   # calibrate: total nappy volume / channel volume

paths:
  trained_dir: models/trained
  prediction_dir: outputs/predictions

# Filled-channel detection. Channels are horizontal; inlet on the LEFT, liquid advances right.
# Each ROI must span the channel's FULL physical length (length_mm) in the photo.
channels:
  dry_rgb: [235, 235, 225]    # empty channel colour AFTER white balance (calibrate from a dry photo)
  wet_rgb: [70, 120, 190]     # liquid-filled colour AFTER white balance (calibrate from a wet photo)
  smooth_px: 9                # moving-average width along the channel
  gap_tol_frac: 0.03          # bubbles/gaps shorter than this fraction of the channel are bridged
  min_contrast: 25            # warn if dry vs wet colours are closer than this (Lab units)
  crosscheck_tol_ml: 10       # warn if colour-volume and channel-volume disagree by more than this
  items:
    ch1: {x: 0.20, y: 0.64, w: 0.20, h: 0.07, length_mm: 30, width_mm: 2.0, depth_mm: 0.5}
    ch2: {x: 0.20, y: 0.75, w: 0.40, h: 0.07, length_mm: 60, width_mm: 2.0, depth_mm: 0.5}
    ch3: {x: 0.20, y: 0.86, w: 0.60, h: 0.07, length_mm: 90, width_mm: 2.0, depth_mm: 0.5}
